
server:
  port: 8080

spring:
  application:
    name: FlightManagementApp

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        #show_sql: true
    defer-datasource-initialization: true

  datasource:
    #url: "jdbc:mariadb://172.17.0.4:3306/FlightManagementApp"
    url: "jdbc:mariadb://localhost:3306/FlightManagementApp"
    username: "root"
    password: "1234"

  sql:
    init:
      mode: always